<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900">
  <defs>
    <linearGradient id="fireBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b090c"/>
      <stop offset="35%" stop-color="#290b08"/>
      <stop offset="68%" stop-color="#b82c09"/>
      <stop offset="100%" stop-color="#070506"/>
    </linearGradient>
    <radialGradient id="blastGlow" cx="50%" cy="54%" r="48%">
      <stop offset="0%" stop-color="#ffbb38" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#e53409" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fadeBot4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="56%" stop-color="#000" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.97"/>
    </linearGradient>
  </defs>
  <rect width="600" height="900" fill="url(#fireBg)"/>
  <circle cx="300" cy="480" r="285" fill="url(#blastGlow)"/>
  <!-- Metro Skyline Silhouette -->
  <g fill="#12090a" opacity="0.65">
    <rect x="20" y="340" width="58" height="300"/>
    <rect x="88" y="290" width="64" height="350"/>
    <rect x="165" y="390" width="48" height="250"/>
    <rect x="395" y="370" width="52" height="270"/>
    <rect x="458" y="275" width="62" height="365"/>
    <rect x="530" y="345" width="55" height="295"/>
  </g>
  <!-- Diagonal Rain Streaks -->
  <g stroke="#ffd9b3" stroke-width="1.2" opacity="0.22">
    <line x1="70" y1="40" x2="35" y2="170"/><line x1="175" y1="25" x2="140" y2="155"/>
    <line x1="290" y1="50" x2="255" y2="180"/><line x1="425" y1="30" x2="390" y2="160"/>
    <line x1="530" y1="65" x2="495" y2="195"/><line x1="120" y1="240" x2="85" y2="370"/>
    <line x1="485" y1="250" x2="450" y2="380"/><line x1="550" y1="430" x2="515" y2="560"/>
  </g>
  <!-- Action Hero Silhouette in Trench Coat & Bandaged Vigilante Vibe -->
  <g>
    <path d="M148 800 L195 452 C205 405 245 385 300 385 C355 385 395 405 405 452 L452 800 Z" fill="#10090b"/>
    <!-- Coat Collar & Flying Hem -->
    <path d="M238 395 L268 440 L300 412 L332 440 L362 395 L348 370 L252 370 Z" fill="#1e1114"/>
    <path d="M168 640 L118 745 L188 730 Z" fill="#12090b"/>
    <path d="M432 640 L488 745 L412 730 Z" fill="#12090b"/>
    <!-- Head Silhouette with Bandage Stripes Rim -->
    <ellipse cx="300" cy="316" rx="44" ry="52" fill="#140c0d"/>
    <path d="M262 300 L340 288" stroke="#f0d2b4" stroke-width="7" opacity="0.72"/>
    <path d="M258 318 L342 308" stroke="#d9b491" stroke-width="6" opacity="0.65"/>
    <path d="M264 338 L336 330" stroke="#f0d2b4" stroke-width="5" opacity="0.5"/>
    <!-- Glowing Rim Eye Glint -->
    <ellipse cx="283" cy="312" rx="6" ry="2.6" fill="#ffbe55"/>
    <ellipse cx="317" cy="310" rx="6" ry="2.6" fill="#ffbe55"/>
    <!-- Rim Light Edge -->
    <path d="M256 316 C256 266 344 266 344 316" fill="none" stroke="#ff9436" stroke-width="3" opacity="0.75"/>
    <path d="M196 452 C208 405 245 386 300 386 C355 386 392 405 404 452" fill="none" stroke="#ff7a24" stroke-width="3.5" opacity="0.8"/>
  </g>
  <!-- Glowing Fire Embers -->
  <g fill="#ffcc5c">
    <circle cx="115" cy="520" r="4" opacity="0.9"/><circle cx="152" cy="445" r="2.5" opacity="0.8"/>
    <circle cx="475" cy="495" r="4.5" opacity="0.9"/><circle cx="440" cy="415" r="3" opacity="0.8"/>
    <circle cx="215" cy="240" r="3" opacity="0.7"/><circle cx="385" cy="220" r="2.5" opacity="0.75"/>
    <circle cx="85" cy="645" r="3.5" opacity="0.85"/><circle cx="515" cy="610" r="3.5" opacity="0.85"/>
    <circle cx="265" cy="540" r="2" opacity="0.7"/><circle cx="345" cy="575" r="3" opacity="0.8"/>
  </g>
  <rect width="600" height="900" fill="url(#fadeBot4)"/>
