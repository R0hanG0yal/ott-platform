<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#c80815" stop-opacity="0.95"/>
      <stop offset="42%" stop-color="#5e040c" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#070507" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="vaultGold" cx="50%" cy="42%" r="36%">
      <stop offset="0%" stop-color="#ffd56b" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#b85d19" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="suitGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ef1622"/>
      <stop offset="65%" stop-color="#9c0810"/>
      <stop offset="100%" stop-color="#2b0205"/>
    </linearGradient>
    <linearGradient id="fadeBot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="55%" stop-color="#000" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.96"/>
    </linearGradient>
  </defs>
  <rect width="600" height="900" fill="url(#bgGlow)"/>
  <!-- Bank Vault Architectural Ring -->
  <g opacity="0.55">
    <circle cx="300" cy="360" r="245" fill="none" stroke="#ffd27d" stroke-width="2" stroke-dasharray="10 14"/>
    <circle cx="300" cy="360" r="215" fill="none" stroke="#e50914" stroke-width="10" opacity="0.45"/>
    <circle cx="300" cy="360" r="180" fill="#120406" stroke="#c98e3a" stroke-width="4"/>
    <circle cx="300" cy="360" r="155" fill="none" stroke="#f0be67" stroke-width="1.5" stroke-dasharray="4 8"/>
    <line x1="300" y1="180" x2="300" y2="540" stroke="#7d4a1b" stroke-width="3" opacity="0.5"/>
    <line x1="120" y1="360" x2="480" y2="360" stroke="#7d4a1b" stroke-width="3" opacity="0.5"/>
    <line x1="172" y1="232" x2="428" y2="488" stroke="#7d4a1b" stroke-width="2" opacity="0.35"/>
    <line x1="428" y1="232" x2="172" y2="488" stroke="#7d4a1b" stroke-width="2" opacity="0.35"/>
  </g>
  <circle cx="300" cy="360" r="220" fill="url(#vaultGold)"/>
  <!-- Floating Euro Bills Silhouette -->
  <g fill="#f6d899" opacity="0.22">
    <rect x="75" y="150" width="58" height="28" rx="2" transform="rotate(-24 104 164)"/>
    <rect x="468" y="195" width="64" height="30" rx="2" transform="rotate(19 500 210)"/>
    <rect x="52" y="455" width="52" height="25" rx="2" transform="rotate(33 78 467)"/>
    <rect x="485" y="435" width="60" height="27" rx="2" transform="rotate(-29 515 448)"/>
    <rect x="130" y="95" width="44" height="21" rx="2" transform="rotate(14 152 105)"/>
    <rect x="425" y="108" width="48" height="22" rx="2" transform="rotate(-17 449 119)"/>
  </g>
  <!-- Iconic Hooded Red Jumpsuit Figure -->
  <g>
    <!-- Shoulders & Jumpsuit Torso -->
    <path d="M138 780 L165 535 C172 478 212 452 252 440 L348 440 C388 452 428 478 435 535 L462 780 Z" fill="url(#suitGrad)"/>
    <!-- Hood -->
    <path d="M222 446 C206 392 214 275 300 264 C386 275 394 392 378 446 C348 468 252 468 222 446 Z" fill="#b30b14"/>
    <path d="M235 436 C225 385 232 292 300 284 C368 292 375 385 365 436 Z" fill="#180507"/>
    <!-- Stylized Surrealist Mask -->
    <ellipse cx="300" cy="368" rx="46" ry="60" fill="#f3e9dc"/>
    <ellipse cx="300" cy="368" rx="46" ry="60" fill="none" stroke="#c8b39b" stroke-width="2"/>
    <!-- Mask Eyes & Brows -->
    <path d="M266 346 Q280 335 292 346" fill="none" stroke="#1a1516" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M308 346 Q320 335 334 346" fill="none" stroke="#1a1516" stroke-width="4.5" stroke-linecap="round"/>
    <ellipse cx="280" cy="358" rx="9" ry="5" fill="#120b0c"/>
    <ellipse cx="320" cy="358" rx="9" ry="5" fill="#120b0c"/>
    <!-- Iconic Upturned Mustache -->
    <path d="M300 392 C288 386 276 394 260 374 C266 394 282 403 300 398 C318 403 334 394 340 374 C324 394 312 386 300 392 Z" fill="#141011"/>
    <!-- Zipper line -->
    <line x1="300" y1="452" x2="300" y2="780" stroke="#2d0306" stroke-width="5"/>
    <rect x="294" y="486" width="12" height="22" rx="3" fill="#d9d9d9" opacity="0.8"/>
    <!-- Origami Red Bird accent -->
    <polygon points="435,280 468,262 456,294" fill="#e50914" opacity="0.9"/>
    <polygon points="435,280 456,294 422,298" fill="#a8050d" opacity="0.9"/>
  </g>
  <!-- Dramatic Rim Highlights -->
  <rect width="600" height="900" fill="url(#fadeBot)"/>
</svg>
