name: Keep Render Awake

on:
  schedule:
    # Runs every 14 minutes to prevent Render free tier from spinning down after 15m idle
    - cron: "*/14 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render /api/health endpoint
        env:
          APP_URL: ${{ vars.RENDER_APP_URL }}
        run: |
          TARGET="${APP_URL:-https://netflix-ott-app.onrender.com}"
          echo "Pinging ${TARGET%/}/api/health ..."
          curl -fsS --max-time 30 "${TARGET%/}/api/health" || echo "Service waking up or not deployed yet."
